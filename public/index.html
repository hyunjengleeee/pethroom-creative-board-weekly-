<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페스룸 소재 리포트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f2; --card:#fff; --ink:#1d1d1f; --sub:#6b6b70; --line:#e7e5e0; --soft:#f1efea;
  --good:#1f8a4c; --good-bg:#e8f5ec; --bad:#c2410c; --bad-bg:#fdeee6; --warn:#a16207; --warn-bg:#fdf6e3;
  --accent:#2f4bd8; --accent-bg:#eef1fd; --pink:#d6337f; --blue:#1e40af; --ev:#b45309; --ev-bg:#fff4e0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141416; --card:#1d1d20; --ink:#ededee; --sub:#a1a1a8; --line:#2c2c31; --soft:#25252a;
    --good:#4ade80; --good-bg:#16291e; --bad:#fb923c; --bad-bg:#2e1d12; --warn:#facc15; --warn-bg:#2b2610;
    --accent:#8ea2ff; --accent-bg:#1f2440; --pink:#f472b6; --blue:#93c5fd; --ev:#fbbf24; --ev-bg:#2d2412;
  }
}
:root[data-theme="dark"]{
  --bg:#141416; --card:#1d1d20; --ink:#ededee; --sub:#a1a1a8; --line:#2c2c31; --soft:#25252a;
  --good:#4ade80; --good-bg:#16291e; --bad:#fb923c; --bad-bg:#2e1d12; --warn:#facc15; --warn-bg:#2b2610;
  --accent:#8ea2ff; --accent-bg:#1f2440; --pink:#f472b6; --blue:#93c5fd; --ev:#fbbf24; --ev-bg:#2d2412;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:20px;font-weight:800;margin:0 0 12px;letter-spacing:-.02em}
h2{font-size:15px;font-weight:800;margin:0 0 10px}
.muted{color:var(--sub);font-size:12.5px}
.nav{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px}
.nav button{border:0;background:none;color:var(--sub);font:inherit;font-weight:700;padding:8px 4px;margin-right:12px;border-bottom:2px solid transparent;cursor:pointer}
.nav button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.weeks{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.weeks button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 11px;font:inherit;font-size:13px;cursor:pointer}
.weeks button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.summary{font-size:16.5px;font-weight:700;line-height:1.55;letter-spacing:-.01em}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
.note{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:6px 10px;margin-top:10px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--sub)}
.kpi .v{font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.3}
.kpi .d{font-size:12px;font-variant-numeric:tabular-nums}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--sub)}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.pts{margin:0;padding:0;list-style:none}
.pts li{margin:0 0 7px;padding-left:14px;position:relative;font-size:14px}
.pts li:before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.45}
.good h2{color:var(--good)} .bad h2{color:var(--bad)} .todo h2{color:var(--accent)}
.todo{background:var(--accent-bg);border-color:transparent}
.ad{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ad:first-of-type{border-top:0;padding-top:0}
.ad img,.ad .ph{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--soft);cursor:zoom-in;display:block}
.ad .nm{font-weight:700;font-size:13.5px;word-break:break-all;line-height:1.35}
.ad .cp{font-size:12.5px;color:var(--sub);margin-top:1px;line-height:1.35}
.ad .m{text-align:right;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.ad .m b{display:block;font-size:15px;color:var(--ink)}
.chip{display:inline-block;font-size:11px;padding:0 6px;border-radius:5px;background:var(--soft);color:var(--sub);margin-right:3px;white-space:nowrap;font-weight:500}
.chip.p-EFC{color:var(--blue)} .chip.p-PSS{color:var(--pink)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--sub);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.na{color:var(--sub)}
.tabs{display:flex;gap:6px;margin:4px 0 10px;flex-wrap:wrap}
.tabs button{border:0;background:var(--soft);color:var(--sub);border-radius:8px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
details.card>summary{cursor:pointer;font-weight:800;font-size:15px;list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary:after{content:"＋";float:right;color:var(--sub)}
details.card[open]>summary:after{content:"－"}
details.card[open]>summary{margin-bottom:10px}
.strip{display:flex;flex-wrap:wrap;gap:6px}
.strip figure{margin:0;width:68px}
.strip img,.strip .ph{width:68px;height:68px;border-radius:6px;object-fit:cover;background:var(--soft);cursor:zoom-in;display:block}
.strip figcaption{font-size:10px;color:var(--sub);line-height:1.3;margin-top:2px;word-break:break-all}
.empty{color:var(--sub);font-size:14px}
.scroll{overflow-x:auto}
/* 행사 */
.ev-head{background:var(--ev-bg);border-color:transparent}
.ev-head .t{font-size:13px;font-weight:800;color:var(--ev)}
.phases{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.ph-pill{background:var(--card);border-radius:10px;padding:8px 12px}
.ph-pill b{display:block;font-size:14px}
.ph-pill span{font-size:12px;color:var(--sub)}
.ph-pill.now{outline:2px solid var(--ev)}
table.cmp{max-width:440px}
.cmp td:nth-child(2){font-weight:800}
.wait{padding:18px;text-align:center;color:var(--sub);font-size:14px;background:var(--soft);border-radius:10px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.lb.on{display:flex} .lb img{max-width:min(480px,100%);max-height:90vh;border-radius:10px}
@media (max-width:760px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .kpis .kpi:nth-child(n+4){grid-column:span 1}
  .grid3{grid-template-columns:1fr}
  .ad{grid-template-columns:48px 1fr}
  .ad img,.ad .ph{width:48px;height:48px}
  .ad .m{grid-column:2;text-align:left}
  .ad .m b{display:inline;font-size:14px;margin-right:6px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>페스룸 소재 리포트</h1>
  <div class="nav" id="nav"></div>
  <div id="sub"></div>
  <div id="app"><div class="muted">불러오는 중…</div></div>
</div>
<div class="lb" id="lb"><img alt=""></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const usd = v => v == null ? "–" : "$" + (Math.abs(v) >= 1000 ? Math.round(v).toLocaleString("en-US") : v.toFixed(2));
const usd0 = v => v == null ? "–" : "$" + Math.round(v).toLocaleString("en-US");
const pct = v => v == null ? "–" : Math.round(v * 100) + "%";
const md = s => s ? `${+s.slice(5, 7)}/${+s.slice(8, 10)}` : "";
const PROD = {EFC: "콤", PSS: "샴푸"};
const cache = {};
const get = async f => cache[f] ||= await (await fetch(`data/${f}`, {cache: "no-cache"})).json();

let INDEX, VIEW = "week", WEEK, TAGDIM = "문구 각도";

function delta(cur, prev, kind, lowerBetter) {
  if (cur == null || prev == null || !prev) return "";
  const diff = kind === "pct" ? cur - prev : (cur - prev) / prev;
  const txt = (diff >= 0 ? "+" : "") + Math.round(diff * 100) + (kind === "pct" ? "%p" : "%");
  const good = lowerBetter ? diff < 0 : diff > 0;
  return `<span class="${Math.abs(diff) < 0.005 ? "flat" : good ? "up" : "down"}">${txt}</span>`;
}
const thumb = c => c.thumb ? `<img src="${esc(c.thumb)}" alt="" loading="lazy" data-zoom>` : `<div class="ph"></div>`;
const chips = c => `<span class="chip p-${c.product}">${PROD[c.product] || c.product}</span>` +
  [c.format, c.angle].filter(x => x && x !== "미분류").map(x => `<span class="chip">${esc(x)}</span>`).join("");
const short = (s, n = 46) => s && s.length > n ? s.slice(0, n - 1) + "…" : s;

function adRow(c, metric) {
  return `<div class="ad">${thumb(c)}
    <div><div class="nm">${esc(c.name)}</div>
      <div class="cp">${c.copy ? `“${esc(short(c.copy))}” ` : ""}${chips(c)}</div></div>
    <div class="m">${metric(c.week)}</div></div>`;
}
const pts = a => `<ul class="pts">${a.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
const kpiBox = (l, v, d = "") => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d || "&nbsp;"}</div></div>`;

function memo(R, labels = ["잘된 점", "아쉬운 점", "다음에 만들 것"]) {
  const box = (cls, t, a) => a.length ? `<div class="card ${cls}"><h2>${t}</h2>${pts(a)}</div>` : "";
  const html = box("good", labels[0], R.good) + box("bad", labels[1], R.bad) + box("todo", labels[2], R.guide);
  return html ? `<div class="grid3">${html}</div>` : "";
}

/* ───────── 주간 ───────── */
function tagTable(W) {
  const rows = W.tagStats[TAGDIM] || [];
  return `<div class="tabs">${Object.keys(W.tagStats).map(k => `<button data-dim="${esc(k)}" aria-pressed="${k === TAGDIM}">${esc(k)}</button>`).join("")}</div>
  <div class="scroll"><table>
    <tr><th>${esc(TAGDIM)}</th><th>소재</th><th>광고비</th><th>주문</th><th>ROAS</th><th>CPL</th></tr>
    ${rows.map(r => `<tr><td><span class="chip p-${r.product}">${PROD[r.product]}</span>${esc(r.value)}</td><td>${r.n}</td><td>${usd0(r.spend)}</td><td>${r.orders}</td><td><b>${pct(r.roas)}</b></td><td>${usd(r.cpl)}</td></tr>`).join("")}
  </table></div>
  <div class="muted" style="margin-top:6px">누적 · $${W.minSpend} 이상 쓴 소재만</div>`;
}

function renderWeek() {
  const W = WEEK, K = W.kpi, P = W.prev || {}, R = W.report;
  const noAmz = W.amzCoverage === "none";
  $("#sub").innerHTML = `<div class="weeks">${INDEX.weeks.map(w => `<button data-w="${w.start}" aria-pressed="${w.start === W.start}">${md(w.start)}~${md(w.end)}${w.partial ? " 진행 중" : ""}</button>`).join("")}</div>
    <div class="muted" style="margin-bottom:12px">업로드 ${K.uploads}개 (집행 ${K.launched}) · 메타 ${md(W.metaTo)} · 아마존 ${md(W.amzTo)}까지 반영</div>`;
  const metric = w => noAmz ? `<b>CPL ${usd(w.cpl)}</b>${usd0(w.spend)} · 리드 ${w.leads}` : `<b>ROAS ${pct(w.roas)}</b>${usd0(w.spend)} · 주문 ${w.orders}`;

  $("#app").innerHTML = `
  <div class="card">
    ${R.summary ? `<div class="summary">${esc(R.summary)}</div><div class="muted" style="margin-top:6px"><span class="badge">${esc(R.status || "초안")}</span> ${esc(R.author)}</div>`
      : `<div class="empty">이번 주 정리 글은 아직 없어요. 숫자와 위닝 소재는 자동이에요.</div>`}
    ${noAmz ? `<div class="note">아마존 데이터 전이라 CPL로 임시 판단했어요.</div>` : W.amzCoverage === "partial" ? `<div class="note">아마존 ${md(W.amzTo)}까지만 반영 — 매출은 더 늘 수 있어요.</div>` : ""}
  </div>

  <div class="kpis">
    ${kpiBox("광고비", usd0(K.spend), delta(K.spend, P.spend))}
    ${kpiBox("ROAS", pct(K.roas), delta(K.roas, P.roas, "pct"))}
    ${kpiBox("주문", `${K.orders}건`, `<span class="flat">${usd0(K.sales)}</span>`)}
    ${kpiBox("CPL", usd(K.cpl), delta(K.cpl, P.cpl, "", true))}
    ${kpiBox("장바구니율", pct(K.atcRate), delta(K.atcRate, P.atcRate, "pct"))}
  </div>

  <div class="card"><h2>🏆 위닝 소재</h2>
    ${W.winners.length ? W.winners.map(c => adRow(c, metric)).join("") : `<div class="empty">기준을 넘은 소재가 없어요.</div>`}
  </div>

  ${memo(R)}
  ${R.landing.length ? `<div class="card"><h2>🧭 랜딩</h2>${pts(R.landing)}</div>` : ""}

  ${W.losers.length ? `<details class="card"><summary>📉 부진 소재 ${W.losers.length}</summary>${W.losers.map(c => adRow(c, metric)).join("")}</details>` : ""}
  <details class="card" id="tagbox"><summary>📊 특징별 성과</summary><div id="tagt">${tagTable(W)}</div></details>
  <details class="card"><summary>제품별</summary><div class="scroll"><table>
      <tr><th>제품</th><th>광고비</th><th>CPL</th><th>장바구니율</th><th>주문</th><th>ROAS</th></tr>
      ${W.products.map(p => `<tr><td><span class="chip p-${p.key}">${PROD[p.key] || p.key}</span>${esc(p.label)}</td><td>${usd0(p.spend)}</td><td>${usd(p.cpl)}</td><td>${pct(p.atcRate)}</td><td>${p.orders}</td><td><b>${pct(p.roas)}</b></td></tr>`).join("")}
  </table></div></details>
  <details class="card"><summary>이번 주 업로드 ${W.uploaded.length}</summary>
    <div class="strip">${W.uploaded.map(c => `<figure>${thumb(c)}<figcaption>${esc(c.name)}${c.spend ? ` · ${usd0(c.spend)}` : ""}</figcaption></figure>`).join("")}</div>
  </details>
  <div class="muted">위닝: 주간 광고비 $${W.minSpend}+ · ROAS 50%+ · 주문 2+ / 부진: $${W.minSpend}+ · ROAS 25% 미만 · 매출은 아마존 14일 어트리뷰션</div>`;

  document.querySelectorAll("[data-w]").forEach(b => b.onclick = () => go("week", b.dataset.w));
  bindTags();
}
function bindTags() {
  document.querySelectorAll("[data-dim]").forEach(b => b.onclick = () => { TAGDIM = b.dataset.dim; $("#tagt").innerHTML = tagTable(WEEK); bindTags(); });
}

/* ───────── 행사 ───────── */
function cmpTable(p) {
  const pre = p.key === "pre", E = p.event, B = p.base;
  const rows = pre
    ? [["광고비", usd0(E.spend), usd0(B.spend)], ["리드", E.leads.toLocaleString(), B.leads.toLocaleString()], ["CPL", usd(E.cpl), usd(B.cpl)],
       ["리드 전환율", pct(E.lpvRate), pct(B.lpvRate)], ["장바구니", E.atc, B.atc], ["장바구니율", pct(E.atcRate), pct(B.atcRate)]]
    : [["광고비", usd0(E.spend), usd0(B.spend)], ["클릭", E.clicks.toLocaleString(), B.clicks.toLocaleString()], ["장바구니", E.atc, B.atc],
       ["주문", E.orders, B.orders], ["매출", usd0(E.sales), usd0(B.sales)], ["ROAS", pct(E.roas), pct(B.roas)]];
  return `<div class="scroll"><table class="cmp"><tr><th></th><th>행사 소재</th><th>상시 소재</th></tr>
    ${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</table></div>`;
}

async function renderEvent() {
  const D = await get(`${INDEX.event.key}.json`), R = D.report;
  const now = new Date(), today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
  $("#sub").innerHTML = "";
  const phaseCard = p => {
    const head = `<h2>${p.label} <span class="muted" style="font-weight:500">${md(p.from)}~${md(p.to)} · ${esc(p.sub)}</span></h2>`;
    if (!p.started || !p.event.spend) return `<div class="card">${head}<div class="wait">${md(p.from)}부터 집계 — 데이터가 들어오면 자동으로 채워져요.</div></div>`;
    const pre = p.key === "pre";
    const metric = w => pre ? `<b>리드 ${w.leads}</b>CPL ${usd(w.cpl)} · 장바구니 ${w.atc}` : `<b>주문 ${w.orders}</b>${usd0(w.spend)} · 장바구니 ${w.atc}`;
    return `<div class="card">${head}
      ${p.amzCoverage !== "full" ? `<div class="note" style="margin:0 0 10px">아마존 ${md(D.amzTo)}까지만 반영됐어요.</div>` : ""}
      ${cmpTable(p)}
      <h2 style="margin-top:16px">${pre ? "리드 많이 모은 행사 소재" : "주문 많은 행사 소재"}</h2>
      ${p.creatives.map(c => adRow(c, metric)).join("")}
      ${p.more ? `<div class="muted" style="margin-top:6px">외 ${p.more}개</div>` : ""}
    </div>`;
  };
  const cur = D.phases.find(p => today >= p.from && today <= p.to) || D.phases[D.phases.length - 1];

  $("#app").innerHTML = `
  <div class="card ev-head">
    <div class="t">🎁 ${esc(D.title)} · ${md(D.from)}~${md(D.to)}</div>
    ${R.summary ? `<div class="summary" style="margin-top:6px">${esc(R.summary)}</div>` : ""}
    <div class="phases">${D.phases.map(p => `<div class="ph-pill ${p === cur ? "now" : ""}"><b>${p.label} ${md(p.from)}~${md(p.to)}</b><span>${esc(p.sub)}</span></div>`).join("")}</div>
    <div class="muted" style="margin-top:8px">캠페인 이름에 PBDD가 들어간 광고만 '행사 소재' · 메타 ${md(D.metaTo)} · 아마존 ${md(D.amzTo)}까지</div>
  </div>
  ${memo(R, ["잘된 점", "아쉬운 점", "체크할 것"])}
  ${D.phases.map(phaseCard).join("")}
  <details class="card"><summary>일별</summary><div class="scroll"><table>
    <tr><th>날짜</th><th>행사 광고비</th><th>리드</th><th>장바구니</th><th>주문</th><th>상시 광고비</th><th>상시 ROAS</th></tr>
    ${D.days.map(x => x.hasMeta ? `<tr><td>${md(x.date)}</td><td>${usd0(x.event.spend)}</td><td>${x.event.leads}</td>
      <td class="${x.hasAmz ? "" : "na"}">${x.hasAmz ? x.event.atc : "–"}</td><td class="${x.hasAmz ? "" : "na"}">${x.hasAmz ? x.event.orders : "–"}</td>
      <td>${usd0(x.base.spend)}</td><td class="${x.hasAmz ? "" : "na"}">${pct(x.base.roas)}</td></tr>`
      : `<tr><td>${md(x.date)}</td><td class="na" colspan="6" style="text-align:center">집계 전</td></tr>`).join("")}
  </table></div><div class="muted" style="margin-top:6px">– = 아마존 데이터 전</div></details>`;
}

/* ───────── 라우팅 ───────── */
async function go(view, week) {
  VIEW = view;
  $("#nav").innerHTML = `<button data-v="week" aria-pressed="${view === "week"}">주간 리포트</button>` +
    (INDEX.event ? `<button data-v="event" aria-pressed="${view === "event"}">🎁 ${esc(INDEX.event.name)}</button>` : "");
  document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => go(b.dataset.v));
  if (view === "event") { history.replaceState(null, "", "#" + INDEX.event.key); return renderEvent(); }
  const pick = INDEX.weeks.find(w => w.start === week) || (WEEK && INDEX.weeks.find(w => w.start === WEEK.start)) ||
    INDEX.weeks.find(w => w.hasReport) || INDEX.weeks.find(w => !w.partial) || INDEX.weeks[0];
  WEEK = await get(`week-${pick.start}.json`);
  history.replaceState(null, "", "#" + pick.start);
  renderWeek();
}

(async () => {
  try { INDEX = await get("index.json"); } catch { $("#app").innerHTML = `<div class="empty">데이터를 불러오지 못했어요.</div>`; return; }
  const h = location.hash.slice(1);
  if (INDEX.event && h === INDEX.event.key) go("event"); else go("week", h);
})();

document.addEventListener("click", e => {
  const img = e.target.closest("[data-zoom]");
  if (img) { $("#lb img").src = img.src; $("#lb").classList.add("on"); }
  else if (e.target.closest("#lb")) $("#lb").classList.remove("on");
});
</script>
